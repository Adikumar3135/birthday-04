<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/memories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: Poppins;
            background: radial-gradient(circle, #b3c7ff, #ccd9ff);
        }

        /* MAIN SECTION */
        .collage {
            min-height: 100vh;
            padding: 40px;
            background: radial-gradient(circle, #b3c7ff, #ccd9ff);
            position: relative;
            max-width: 1200px;
            margin: auto;
        }

        /* FRAME */
        .frame {
            position: absolute;
            width: 22vw;
            max-width: 280px;
            background: #ea6464;
            padding: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
            cursor: pointer;
            transition: .4s;
        }

        /* IMAGE FIX */
        .frame img {
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: cover;
        }

        /* SHAPES */
        .circle {
            border-radius: 50%;
        }

        .circle img {
            border-radius: 50%;
        }

        .square {
            transform: rotate(-5deg);
        }

        .square.right {
            transform: rotate(6deg);
        }

        .square.bottom {
            transform: rotate(-8deg);
        }

        /* POSITIONS (RESPONSIVE) */
        .left {
            left: 10%;
            top: 20%;
        }

        .top {
            top: 5%;
            left: 40%;
        }

        .right {
            right: 10%;
            top: 20%;
        }

        .bottom {
            bottom: 10%;
            left: 35%;
        }

        .bottom-right {
            right: 15%;
            bottom: 5%;
        }

        /* HOVER */
        .frame:hover {
            transform: scale(1.08) rotate(0deg);
        }

        /* HEARTS */
        .heart {
            position: absolute;
            bottom: 10px;
        }

        .heart1 {
            position: absolute;
            right: 20px;
            bottom: 0;
        }

        .heart3 {
            position: absolute;
            left: 32%;
            bottom: 253px;
        }

        .heart img {
            width: 30vw;
            max-width: 500px;
        }

        .heart1 img {
            width: 35vw;
            max-width: 650px;
        }

        .heart3 img {
            width: 18vw;
            max-width: 300px;
        }

        /* BUTTON */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            z-index: 999;
        }

        /* ================= MOBILE ================= */
        @media(max-width:768px) {

            .collage {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                position: static;
            }

            .frame {
                position: static;
                width: 90%;
                max-width: 300px;
                transform: none !important;
            }

            .heart,
            .heart1,
            .heart3 {
                display: none;
            }
        }

        /* ================= BIG SCREEN ================= */
        @media(min-width:1400px) {
            .frame {
                max-width: 340px;
            }
        }
    </style>
</head>

<body>

    <button class="home-btn" onclick="window.location.href='index.html'">⬅️ Home</button>

    <section class="collage">

        <div class="frame square left">
            <img src="1 (1).jpg">
        </div>

        <div class="frame circle top">
            <img src="1 (2).jpg">
        </div>

        <div class="frame square right">
            <img src="1 (3).jpg">
        </div>

        <div class="frame square bottom">
            <img src="1 (4).jpg">
        </div>

        <div class="frame circle bottom-right">
            <img src="2.jpg">
        </div>

    </section>

    <div class="heart">
        <img src="heart.png">
    </div>

    <div class="heart1">
        <img src="heart1.png">
    </div>

    <div class="heart3">
        <img src="heart3 (2).png">
    </div>

</body>

</html>
